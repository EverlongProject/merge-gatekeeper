name: "Merge Gatekeeper"
description: "Get better merge control"
branding:
  icon: git-merge
  color: orange
inputs:
  token:
    description: "set github token"
    required: true
  self:
    description: "set self job name"
    required: false
    default: "merge-gatekeeper"
  interval:
    description: "set validate interval second (default 5)"
    required: false
    default: "5"
  timeout:
    description: "set validate timeout second (default 600)"
    required: false
    default: "600"
  ignored:
    description: "set ignored jobs (comma-separated list)"
    required: false
    default: ""
  ignore-dynamic-github-workflows:
    description: "ignore check runs whose backing GitHub workflow path starts with dynamic/"
    required: false
    default: "true"
  success-confirmation-polls:
    description: "set additional successful polls required after first green"
    required: false
    default: "0"
  ref:
    description: "set ref of github repository. the ref can be a SHA, a branch name, or tag name"
    required: false
    default: ${{ github.event.pull_request.head.sha }}
runs:
  using: "docker"
  image: "Dockerfile"
  args:
    - "validate"
    - "--token=${{ inputs.token }}"
    - "--self=${{ inputs.self }}"
    - "--interval=${{ inputs.interval }}"
    - "--ref=${{ inputs.ref }}"
    - "--timeout=${{ inputs.timeout }}"
    - "--success-confirmation-polls=${{ inputs.success-confirmation-polls }}"
    - "--ignored=${{ inputs.ignored }}"
    - "--ignore-dynamic-github-workflows=${{ inputs.ignore-dynamic-github-workflows }}"
